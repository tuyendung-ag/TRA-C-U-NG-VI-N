<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --primary: #1769e8;
      --primary-soft: #edf4ff;

      --green: #079455;
      --green-soft: #eaf8f1;

      --orange: #dc6803;
      --orange-soft: #fff4e5;

      --purple: #6938ef;
      --purple-soft: #f1edff;

      --red: #d92d20;
      --red-soft: #fff0ef;

      --text: #101828;
      --text-secondary: #475467;
      --muted: #667085;

      --border: #e4e7ec;
      --background: #f6f8fc;
      --white: #ffffff;

      --shadow:
        0 2px 5px rgba(16, 24, 40, 0.03),
        0 8px 22px rgba(16, 24, 40, 0.04);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body,
    button,
    input,
    select,
    textarea {
      font-family:
        "Be Vietnam Pro",
        "Segoe UI",
        Arial,
        sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
      color: var(--text);
      font-size: 14px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button,
    input,
    select {
      font-size: 13px;
    }

    button {
      cursor: pointer;
    }

    .app {
      display: grid;
      grid-template-columns:
        225px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 22px 15px;
      background: var(--white);
      border-right: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 3px 7px 21px;
      margin-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }

    .brand-logo {
      width: 43px;
      height: 43px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 13px;
      color: var(--white);
      background:
        linear-gradient(
          135deg,
          #3286f5,
          #155ecf
        );
      font-size: 17px;
      font-weight: 800;
      box-shadow:
        0 8px 18px rgba(23, 105, 232, 0.25);
    }

    .brand-name {
      font-size: 15px;
      font-weight: 800;
    }

    .brand-subtitle {
      margin-top: 1px;
      color: var(--muted);
      font-size: 8.5px;
      font-weight: 700;
      letter-spacing: 1.2px;
    }

    .menu-label {
      padding: 0 10px;
      margin-bottom: 8px;
      color: #98a2b3;
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .menu-button {
      width: 100%;
      height: 46px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 14px;
      margin-bottom: 7px;
      border: 0;
      border-radius: 11px;
      background: transparent;
      color: #344054;
      font-weight: 600;
      text-align: left;
      transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .menu-button:hover {
      background: #eef4ff;
      color: var(--primary);
      transform: translateX(2px);
    }

    .menu-button.active {
      color: var(--white);
      background:
        linear-gradient(
          135deg,
          #2f80ed,
          #1769e8
        );
      box-shadow:
        0 8px 18px rgba(23, 105, 232, 0.24);
    }

    .menu-button svg {
      width: 18px;
      height: 18px;
      stroke-width: 2.1;
      flex: 0 0 auto;
    }

    .main {
      min-width: 0;
      padding: 28px;
    }

    .page {
      display: none;
      animation: fadeIn 0.2s ease;
    }

    .page.active {
      display: block;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(3px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 7px;
      font-size: 27px;
      font-weight: 800;
      letter-spacing: -0.6px;
      line-height: 1.3;
    }

    .subtitle {
      color: var(--muted);
      font-size: 12.5px;
    }

    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    .sync-status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--white);
      color: var(--muted);
      font-size: 10.5px;
      white-space: nowrap;
    }

    .sync-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #12b76a;
      box-shadow:
        0 0 0 4px rgba(18, 183, 106, 0.12);
    }

    .cards {
      display: grid;
      grid-template-columns:
        repeat(5, minmax(160px, 1fr));
      gap: 14px;
      margin-bottom: 19px;
    }

    .card,
    .panel {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 15px;
      box-shadow: var(--shadow);
    }

    .stat-card {
      display: grid;
      grid-template-columns:
        76px minmax(0, 1fr);
      align-items: center;
      gap: 15px;
      min-height: 125px;
      padding: 17px;
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .stat-card:hover {
      transform: translateY(-2px);
      box-shadow:
        0 12px 28px rgba(16, 24, 40, 0.08);
    }

    .stat-icon {
      width: 72px;
      height: 72px;
      display: grid;
      place-items: center;
      margin: 0;
      border-radius: 18px;
    }

    .stat-icon svg {
      width: 30px;
      height: 30px;
      stroke-width: 2;
    }

    .icon-blue {
      color: var(--primary);
      background: var(--primary-soft);
    }

    .icon-green {
      color: var(--green);
      background: var(--green-soft);
    }

    .icon-orange {
      color: var(--orange);
      background: var(--orange-soft);
    }

    .icon-purple {
      color: var(--purple);
      background: var(--purple-soft);
    }

    .icon-red {
      color: var(--red);
      background: var(--red-soft);
    }

    .stat-content {
      min-width: 0;
    }

    .stat-value {
      margin-bottom: 7px;
      font-size: 31px;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.7px;
    }

    .stat-label {
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 600;
    }

    .blue {
      color: var(--primary);
    }

    .green {
      color: var(--green);
    }

    .orange {
      color: var(--orange);
    }

    .purple {
      color: var(--purple);
    }

    .red {
      color: var(--red);
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns:
        minmax(0, 1.45fr)
        minmax(330px, 0.75fr);
      gap: 19px;
      margin-bottom: 19px;
    }

    .dashboard-grid.equal {
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
    }

    .panel {
      padding: 19px;
      margin-bottom: 19px;
    }

    .chart-panel {
      margin-bottom: 0;
    }

    .panel-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 14px;
    }

    .panel-title {
      margin: 0;
      font-size: 15.5px;
      font-weight: 700;
    }

    .panel-description {
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
    }

    .chart-label {
      padding: 6px 9px;
      border-radius: 20px;
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 10px;
      font-weight: 700;
    }

    .chart-box {
      position: relative;
      height: 290px;
    }

    .chart-box.large {
      height: 315px;
    }

    .chart-box.tall {
      height: 340px;
    }

    .search-panel {
      margin-bottom: 19px;
    }

    .search-box {
      position: relative;
    }

    .search-box input {
      width: 100%;
      height: 49px;
      padding: 0 48px 0 44px;
      border: 1.5px solid #cbd5e1;
      border-radius: 11px;
      background: var(--white);
      color: var(--text);
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow:
        0 0 0 4px rgba(23, 105, 232, 0.09);
    }

    .search-left-icon {
      position: absolute;
      left: 15px;
      top: 14px;
      color: #98a2b3;
    }

    .search-left-icon svg {
      width: 18px;
      height: 18px;
    }

    .search-clear {
      position: absolute;
      right: 12px;
      top: 9px;
      width: 31px;
      height: 31px;
      display: none;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #98a2b3;
    }

    .search-clear:hover {
      background: #f1f4f8;
      color: var(--text);
    }

    .search-clear svg {
      width: 17px;
      height: 17px;
    }

    .search-layout {
      display: grid;
      grid-template-columns:
        minmax(300px, 0.68fr)
        minmax(0, 1.32fr);
      gap: 18px;
      align-items: start;
    }

    .result-panel {
      min-height: 190px;
    }

    .candidate-panel {
      padding: 0;
      overflow: hidden;
    }

    .result-item {
      padding: 13px;
      margin-bottom: 10px;
      border: 1px solid var(--border);
      border-radius: 11px;
      cursor: pointer;
    }

    .result-item:hover {
      border-color: #9bbcf4;
      background: #f8fbff;
    }

    .result-item.active {
      border-color: var(--primary);
      background: var(--primary-soft);
      box-shadow:
        0 0 0 3px rgba(23, 105, 232, 0.06);
    }

    .result-name {
      margin-bottom: 5px;
      font-size: 13.5px;
      font-weight: 700;
    }

    .result-meta {
      color: var(--muted);
      font-size: 11.2px;
      line-height: 1.6;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 700;
    }

    .badge-orange {
      color: var(--orange);
      background: var(--orange-soft);
    }

    .badge-red {
      color: var(--red);
      background: var(--red-soft);
    }

    .candidate-compact {
      display: grid;
      gap: 15px;
      padding: 0 18px 18px;
    }

    .compact-profile-header {
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      gap: 15px;
      margin: 0 -18px;
      padding: 18px 20px;
      color: #ffffff;
      background:
        linear-gradient(
          135deg,
          #1769e8,
          #4f8df3
        );
    }

    .compact-profile-header::after {
      content: "";
      position: absolute;
      width: 130px;
      height: 130px;
      right: -42px;
      top: -55px;
      border-radius: 50%;
      background:
        rgba(255, 255, 255, 0.12);
    }

    .compact-avatar {
      position: relative;
      z-index: 1;
      width: 51px;
      height: 51px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 2px solid rgba(255, 255, 255, 0.65);
      border-radius: 14px;
      background:
        rgba(255, 255, 255, 0.16);
      font-size: 18px;
      font-weight: 800;
    }

    .compact-profile-content {
      position: relative;
      z-index: 1;
    }

    .compact-profile-name {
      margin-bottom: 4px;
      font-size: 19px;
      font-weight: 800;
    }

    .compact-profile-position {
      color:
        rgba(255, 255, 255, 0.88);
      font-size: 11.5px;
    }

    .warning {
      padding: 12px 13px;
      border: 1px solid #f7ce82;
      border-radius: 10px;
      background: #fff9e9;
      color: #8a5500;
      font-size: 11.5px;
    }

    .compact-info-section,
    .compact-history-section {
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--white);
    }

    .compact-info-section {
      background:
        linear-gradient(
          180deg,
          #f7faff,
          #ffffff 44%
        );
    }

    .compact-section-heading {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 13px;
      font-size: 13.5px;
      font-weight: 700;
    }

    .compact-section-icon {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      color: var(--primary);
      background: var(--primary-soft);
    }

    .compact-section-icon.green {
      color: var(--green);
      background: var(--green-soft);
    }

    .compact-section-icon svg {
      width: 15px;
      height: 15px;
    }

    .compact-info-grid {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .compact-info-item {
      min-width: 0;
      padding: 11px 12px;
      border: 1px solid #e5eaf1;
      border-radius: 10px;
      background: var(--white);
    }

    .compact-info-label {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 9.3px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.35px;
    }

    .compact-info-value {
      color: #344054;
      font-size: 11.8px;
      font-weight: 600;
      line-height: 1.5;
      word-break: break-word;
    }

    .compact-link-button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border-radius: 8px;
      color: var(--primary);
      background: var(--primary-soft);
      font-size: 10.5px;
      font-weight: 700;
      text-decoration: none;
    }

    .compact-link-button.orange {
      color: var(--orange);
      background: var(--orange-soft);
    }

    .compact-link-button svg {
      width: 13px;
      height: 13px;
    }

    .compact-history-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .compact-history-table {
      min-width: 1050px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }

    th {
      padding: 10px 11px;
      background: #f7f9fc;
      color: var(--text-secondary);
      font-size: 9.8px;
      font-weight: 700;
      text-align: left;
      white-space: nowrap;
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 10px 11px;
      color: var(--text-secondary);
      vertical-align: top;
      border-bottom: 1px solid var(--border);
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    .status-cell {
      max-width: 180px;
      white-space: normal;
      line-height: 1.5;
    }

    .interview-toolbar {
      display: grid;
      grid-template-columns:
        minmax(220px, 1.4fr)
        minmax(140px, 0.75fr)
        minmax(190px, 1fr)
        minmax(150px, 0.75fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .filter-control {
      width: 100%;
      height: 42px;
      padding: 0 11px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--white);
      color: var(--text-secondary);
      outline: none;
    }

    .filter-control:focus {
      border-color: var(--primary);
      box-shadow:
        0 0 0 3px rgba(23, 105, 232, 0.08);
    }

    .interview-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 10px 13px;
      margin-bottom: 13px;
      border-radius: 9px;
      background: #f8fafc;
      color: var(--muted);
      font-size: 10.8px;
    }

    .interview-summary strong {
      color: var(--text);
    }

    .interview-card {
      display: grid;
      grid-template-columns:
        minmax(190px, 0.95fr)
        minmax(210px, 1.35fr)
        minmax(180px, 1fr)
        minmax(135px, 0.7fr);
      gap: 17px;
      align-items: center;
      padding: 14px;
      margin-bottom: 10px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--white);
    }

    .interview-date {
      color: var(--primary);
      font-size: 11.5px;
      font-weight: 700;
      line-height: 1.55;
    }

    .interview-name {
      margin-bottom: 4px;
      font-size: 12.5px;
      font-weight: 700;
    }

    .interview-meta {
      color: var(--muted);
      font-size: 10.8px;
      line-height: 1.65;
    }

    .result-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 110px;
      max-width: 150px;
      padding: 7px 11px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 700;
      line-height: 1.3;
      text-align: center;
      white-space: normal;
    }

    .result-pass {
      color: #067647;
      background: #e8f8f0;
      border: 1px solid #b7ebd1;
    }

    .result-fail {
      color: #b42318;
      background: #fff0ef;
      border: 1px solid #f7c1bc;
    }

    .result-pending {
      color: #6b7280;
      background: #f2f4f7;
      border: 1px solid #dfe3e8;
    }

    .pagination {
      display: flex;
      justify-content: center;
      gap: 7px;
      margin-top: 18px;
    }

    .page-button {
      min-width: 34px;
      height: 34px;
      padding: 0 9px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--white);
      color: var(--text-secondary);
      font-weight: 600;
    }

    .page-button.active {
      border-color: var(--primary);
      background: var(--primary);
      color: var(--white);
    }

    .empty-state {
      padding: 35px 15px;
      border: 1px dashed #cbd5e1;
      border-radius: 11px;
      background: #fafbfc;
      color: var(--muted);
      font-size: 11.5px;
      text-align: center;
    }

    .loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      background:
        rgba(246, 248, 252, 0.82);
      backdrop-filter: blur(2px);
    }

    .loading.show {
      display: flex;
    }

    .loading-box {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 13px 18px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--white);
      color: var(--primary);
      font-size: 11.5px;
      font-weight: 700;
      box-shadow: var(--shadow);
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid #dce8fb;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .error-box {
      padding: 13px 15px;
      margin-bottom: 18px;
      border: 1px solid #f5b7b1;
      border-radius: 10px;
      background: var(--red-soft);
      color: #b42318;
      font-size: 11.5px;
    }

    @media (max-width: 1400px) {
      .cards {
        grid-template-columns:
          repeat(3, minmax(190px, 1fr));
      }
    }

    @media (max-width: 1250px) {
      .dashboard-grid,
      .dashboard-grid.equal {
        grid-template-columns: 1fr;
      }

      .interview-toolbar {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 950px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }

      .menu-button {
        display: inline-flex;
        width: auto;
        margin-right: 5px;
      }

      .main {
        padding: 20px;
      }

      .search-layout {
        grid-template-columns: 1fr;
      }

      .interview-card {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 650px) {
      .main {
        padding: 15px;
      }

      .page-header {
        display: block;
      }

      .sync-status {
        width: fit-content;
        margin-top: 12px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .stat-card {
        grid-template-columns:
          68px minmax(0, 1fr);
      }

      .stat-icon {

<style>
/* ===== AI HELPERS ===== */
function getAiVerdictClass(v){
  const s=normalizeText(v||"");
  if(s.indexOf("rat phu hop")>=0)return "excellent";
  if(s.indexOf("phu hop")>=0)return "fit";
  if(s.indexOf("can nhac")>=0)return "consider";
  return "reject";
}

function aiListHtml(items){
  if(!Array.isArray(items)||!items.length)return '<div style="color:#98a2b3;font-size:10.5px">Không ghi nhận.</div>';
  return '<ul class="ai-detail-list">'+items.map(function(x){return '<li>'+escapeHtml(x)+'</li>';}).join('')+'</ul>';
}

</script>
  <div class="department-toast" id="departmentToast"></div>

<script>
(function(){
  function applyFinalRedStates(){
    document.querySelectorAll('tr').forEach(function(tr){
      var txt=(tr.textContent||'').trim().toUpperCase();
      if(txt === 'JOB ĐÃ ĐÓNG' || txt.indexOf('JOB ĐÃ ĐÓNG') === 0){
        tr.style.background='#fff1f0';
        tr.style.color='#c62828';
        tr.querySelectorAll('td,th').forEach(function(c){
          c.style.background='#fff1f0'; c.style.color='#c62828';
          c.style.borderColor='#ffc9c5';
        });
      }
      if(txt === 'HR ĐÃ NGHỈ' || txt.indexOf('HR ĐÃ NGHỈ') === 0){
        tr.style.background='#fff1f0';
        tr.style.color='#c62828';
        tr.querySelectorAll('td,th').forEach(function(c){
          c.style.background='#fff1f0'; c.style.color='#c62828';
          c.style.borderColor='#ffc9c5';
        });
      }
    });
    document.querySelectorAll('span,div,button').forEach(function(el){
      var txt=(el.textContent||'').trim();
      if(txt === 'Đã đóng'){
        el.style.background='#ffe3e0';
        el.style.color='#c62828';
        el.style.borderColor='#ffc2bd';
      }
    });
  }
  document.addEventListener('DOMContentLoaded', function(){
    applyFinalRedStates();
    new MutationObserver(applyFinalRedStates).observe(document.body,{childList:true,subtree:true});
  });
})();


/* ===== AI LỌC CV ===== */
let aiJobs = [];
let aiCandidates = [];
let aiSelectedJob = null;
let aiConfig = null;

function setupAiScreening(){
  // AI được tích hợp trực tiếp trong từng Job, không còn trang AI riêng.
  loadAiScoreConfig();
}

function loadAiScoreConfig(){
  jsonpRequest("getAiScoreConfig",{}, {timeoutMs:20000,retries:1})
    .then(function(data){ aiConfig=data||{}; renderAiScoreConfig(aiConfig); })
    .catch(function(){
      aiConfig={weights:[
        {key:"experience",label:"Kinh nghiệm làm việc",max:25},
        {key:"technicalSkills",label:"Kỹ năng chuyên môn",max:25},
        {key:"jobFit",label:"Mức độ phù hợp với công việc",max:20},
        {key:"education",label:"Học vấn / Chứng chỉ",max:10},
        {key:"achievements",label:"Thành tích / Kết quả",max:10},
        {key:"softSkills",label:"Kỹ năng mềm",max:5},
        {key:"additional",label:"Các yêu cầu bổ sung",max:5}
      ]}; renderAiScoreConfig(aiConfig);
    });
}

function renderAiScoreConfig(config){
  const body=document.getElementById("aiScoreConfigBody"); if(!body)return;
  const desc={
    experience:"Số năm, vị trí từng làm, mức độ phù hợp với yêu cầu.",
    technicalSkills:"Các kỹ năng / technical skills mà JD yêu cầu.",
    jobFit:"Mức tương đồng giữa công việc trước đây và vị trí đang tuyển.",
    education:"Bằng cấp, chuyên ngành, chứng chỉ theo JD.",
    achievements:"KPI, dự án, thành tích, quy mô công việc có bằng chứng.",
    softSkills:"Giao tiếp, teamwork, giải quyết vấn đề, quản lý công việc.",
    additional:"Ngoại ngữ, địa điểm, thời gian làm việc và yêu cầu bổ sung."
  };
  body.innerHTML=(config.weights||[]).map(function(w){
    return `<tr><td><strong>${escapeHtml(w.label)}</strong><div style="margin-top:3px;color:#667085;font-size:9.5px;">${escapeHtml(desc[w.key]||"")}</div></td><td><strong>${Number(w.max)||0}</strong></td><td>${escapeHtml(desc[w.key]||"")}</td></tr>`;
  }).join("");
}

function loadAiJobs(){
  const select=document.getElementById("aiJobSelect");
  if(!select)return;
  if(aiJobs.length){ fillAiJobs(); return; }
  select.innerHTML='<option value="">Đang tải Job...</option>';
  jsonpRequest("getJobs",{}, {timeoutMs:45000,retries:2})
    .then(function(data){
      aiJobs=(data&&Array.isArray(data.rows)?data.rows:[]).filter(function(j){return normalizeText(j.status)==="dang mo";});
      fillAiJobs();
    }).catch(handleError);
}

function fillAiJobs(){
  const select=document.getElementById("aiJobSelect");
  select.innerHTML='<option value="">Chọn Job đang mở</option>' + aiJobs.map(function(j){
    return `<option value="${escapeAttribute(j.jobCode)}">${escapeHtml(j.jobCode)} · ${escapeHtml(j.position)}</option>`;
  }).join("");
  onAiJobChange();
}

function onAiJobChange(){
  const code=document.getElementById("aiJobSelect").value;
  aiSelectedJob=aiJobs.find(function(j){return String(j.jobCode)===String(code);})||null;
  const info=document.getElementById("aiJobInfo");
  const load=document.getElementById("aiLoadCandidatesBtn");
  const batch=document.getElementById("aiBatchBtn");
  if(aiSelectedJob){
    info.innerHTML=`<strong>${escapeHtml(aiSelectedJob.department||"")}</strong>&nbsp; · &nbsp;${escapeHtml(aiSelectedJob.position||"")}`;
    load.disabled=false;
  }else{
    info.textContent="Chọn Job để bắt đầu";
    load.disabled=true; batch.disabled=true;
  }
  aiCandidates=[];
  document.getElementById("aiCandidateResults").innerHTML='<div class="empty-state">Chọn Job và bấm “Tải CV phù hợp”.</div>';
}

function loadAiCandidates(){
  if(!aiSelectedJob)return;
  showLoading(true); clearError();
  jsonpRequest("searchDepartmentCandidates",{
    department:aiSelectedJob.department||"",
    position:aiSelectedJob.position||"",
    fromDate:"",toDate:""
  },{timeoutMs:45000,retries:2})
  .then(function(data){
    showLoading(false);
    const raw=(data&&Array.isArray(data.rows)?data.rows:[]);
    aiCandidates=dedupeDepartmentRows(raw).sort(sortDepartmentRows);
    renderAiCandidates();
  }).catch(handleError);
}

function renderAiCandidates(){
  const wrap=document.getElementById("aiCandidateResults");
  const summary=document.getElementById("aiCandidateSummary");
  const batch=document.getElementById("aiBatchBtn");
  summary.textContent=`${formatNumber(aiCandidates.length)} CV phù hợp với ${aiSelectedJob?aiSelectedJob.position:"Job"}. Chưa có điểm AI sẽ được ưu tiên.`;
  batch.disabled=!aiCandidates.some(function(r){return !r.aiScore;});
  if(!aiCandidates.length){wrap.innerHTML='<div class="empty-state">Không có CV phù hợp với Job đã chọn.</div>';return;}
  wrap.innerHTML=`<div class="ai-candidate-table-wrap"><table class="ai-candidate-table"><thead><tr><th>Ứng viên</th><th>CV</th><th>Ngày nhận</th><th>AI Score</th><th>Kết luận</th><th></th></tr></thead><tbody>${aiCandidates.map(renderAiCandidateRow).join("")}</tbody></table></div>`;
  lucide.createIcons();
}

function renderAiCandidateRow(row){
  const score=row.aiScore;
  const total=score?Number(score.total||0):0;
  const cls=score?(total>=70?"high":total>=55?"mid":"low"):"pending";
  const verdict=score?score.verdict:"Chưa chấm AI";
  return `<tr data-ai-row="${Number(row.rowNumber)||0}"><td><strong>${escapeHtml(row.fullName||"")}</strong><div style="color:#667085;font-size:9.5px;margin-top:2px;">${escapeHtml(row.position||"")}</div></td><td>${row.cvLink?`<a class="department-link" href="${escapeAttribute(row.cvLink)}" target="_blank" rel="noopener noreferrer">Xem CV <i data-lucide="external-link"></i></a>`:"<span style='color:#98a2b3'>Chưa có</span>"}</td><td>${escapeHtml(row.receivedDate||"")}</td><td><span class="ai-score-pill ${cls}">${score?formatNumber(total)+"/100":"—"}</span></td><td><span class="ai-verdict ${getAiVerdictClass(verdict)}">${escapeHtml(verdict)}</span></td><td><button class="ai-run-btn" type="button" data-ai-run="${Number(row.rowNumber)||0}">${score?"Xem đánh giá":"AI chấm CV"}</button></td></tr>`;
}

function getAiVerdictClass(v){
  const s=normalizeText(v||"");
  if(s.indexOf("rat phu hop")>=0)return "excellent";
  if(s.indexOf("phu hop")>=0)return "fit";
  if(s.indexOf("can nhac")>=0)return "consider";
  return "reject";
}

function runAiSingle(rowNumber){
  const row=aiCandidates.find(function(r){return Number(r.rowNumber)===Number(rowNumber);});
  if(!row||!aiSelectedJob)return;
  if(row.aiScore){showAiDetail(row);return;}
  const btn=document.querySelector(`[data-ai-run="${Number(rowNumber)}"]`);
  if(btn){btn.disabled=true;btn.textContent="AI đang chấm...";}
  jsonpRequest("aiScoreCandidate",{rowNumber:rowNumber,jobCode:aiSelectedJob.jobCode},{timeoutMs:90000,retries:1})
    .then(function(data){
      const target=aiCandidates.find(function(r){return Number(r.rowNumber)===Number(rowNumber);});
      if(target) target.aiScore=data&&data.aiScore?data.aiScore:null;
      renderAiCandidates();
      if(target) showAiDetail(target);
    }).catch(function(e){
      if(btn){btn.disabled=false;btn.textContent="AI chấm CV";}
      handleError(e);
    });
}

function runAiBatch(){
  if(!aiSelectedJob)return;
  const rows=aiCandidates.filter(function(r){return !r.aiScore&&r.cvLink;}).slice(0,5).map(function(r){return Number(r.rowNumber);});
  if(!rows.length){showDepartmentToast("Không còn CV chưa chấm AI.");return;}
  const batch=document.getElementById("aiBatchBtn"); batch.disabled=true; batch.textContent="AI đang chấm..."; showLoading(true);
  jsonpRequest("aiScoreBatch",{rowNumbers:JSON.stringify(rows),jobCode:aiSelectedJob.jobCode},{timeoutMs:300000,retries:0})
    .then(function(data){
      showLoading(false); batch.textContent="AI chấm tối đa 5 CV";
      (data&&data.results||[]).forEach(function(x){var r=aiCandidates.find(function(a){return Number(a.rowNumber)===Number(x.rowNumber);});if(r)r.aiScore=x.aiScore;});
      renderAiCandidates();
      if(data&&data.errors&&data.errors.length) showDepartmentToast("Đã chấm xong, có "+data.errors.length+" CV lỗi.");
    }).catch(function(e){showLoading(false);batch.disabled=false;batch.textContent="AI chấm tối đa 5 CV";handleError(e);});
}

function showAiDetail(row){
  const s=row&&row.aiScore;if(!s)return;
  let modal=document.getElementById("aiDetailModal");
  if(!modal){
    modal=document.createElement("div");modal.id="aiDetailModal";modal.className="ai-detail-modal";
    modal.innerHTML='<div class="ai-detail-box"><div class="ai-detail-top"><div><div class="ai-score-title" id="aiDetailTitle"></div><div class="ai-score-sub" id="aiDetailSub"></div></div><button class="ai-close" type="button" id="aiDetailClose">×</button></div><div class="ai-detail-body" id="aiDetailBody"></div></div>';
    document.body.appendChild(modal);document.getElementById("aiDetailClose").onclick=function(){modal.classList.remove("show")};
    modal.addEventListener("click",function(e){if(e.target===modal)modal.classList.remove("show")});
  }
  document.getElementById("aiDetailTitle").textContent=(row.fullName||"")+" · "+(s.total||0)+"/100";
  document.getElementById("aiDetailSub").textContent=(row.position||"")+" · "+(s.verdict||"")+" · Đánh giá "+(s.evaluatedAt||"");
  const weights=(aiConfig&&aiConfig.weights)||[];
  const scoreRows=weights.map(function(w){const v=Number(s.scores&&s.scores[w.key]||0);return `<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:10.5px;font-weight:800"><span>${escapeHtml(w.label)}</span><span>${v}/${Number(w.max)}</span></div><div class="ai-score-meter"><span style="width:${Math.max(0,Math.min(100,v/Number(w.max||1)*100))}%"></span></div></div>`;}).join("");
  document.getElementById("aiDetailBody").innerHTML=`<div class="ai-detail-grid"><div><div class="ai-detail-section"><h3>Chi tiết điểm</h3>${scoreRows}</div><div class="ai-detail-section" style="margin-top:12px"><h3>Nhận định AI</h3><div class="ai-detail-summary">${escapeHtml(s.summary||"Chưa có nhận định.")}</div></div></div><div><div class="ai-detail-section"><h3>Điểm mạnh</h3>${aiListHtml(s.strengths)}</div><div class="ai-detail-section" style="margin-top:12px"><h3>Điểm yếu / rủi ro</h3>${aiListHtml(s.weaknesses)}</div><div class="ai-detail-section" style="margin-top:12px"><h3>Yêu cầu chưa thấy bằng chứng</h3>${aiListHtml(s.missing)}</div></div></div>`;
  modal.classList.add("show");
}

function aiListHtml(items){
  if(!Array.isArray(items)||!items.length)return '<div style="color:#98a2b3;font-size:10.5px">Không ghi nhận.</div>';
  return '<ul class="ai-detail-list">'+items.map(function(x){return '<li>'+escapeHtml(x)+'</li>';}).join('')+'</ul>';
}

document.addEventListener("click",function(e){
  const btn=e.target.closest&&e.target.closest("[data-ai-run]");
  if(btn){runAiSingle(Number(btn.getAttribute("data-ai-run")));}
});

document.addEventListener("DOMContentLoaded",setupAiScreening);

</script>
